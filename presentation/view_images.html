<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspect Presentation Screenshots</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            padding: 15px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
            text-align: center;
        }
        .card-body {
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            flex-grow: 1;
        }
        img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Screenshots Inspector</h1>
    <div class="grid">
        <div class="card">
            <div class="card-header">media__1779003259407.png</div>
            <div class="card-body"><img src="assets/media__1779003259407.png" alt="Screenshot 1"></div>
        </div>
        <div class="card">
            <div class="card-header">media__1779003383391.png</div>
            <div class="card-body"><img src="assets/media__1779003383391.png" alt="Screenshot 2"></div>
        </div>
        <div class="card">
            <div class="card-header">media__1779010092137.png</div>
            <div class="card-body"><img src="assets/media__1779010092137.png" alt="Screenshot 3"></div>
        </div>
        <div class="card">
            <div class="card-header">media__1779012902167.png</div>
            <div class="card-body"><img src="assets/media__1779012902167.png" alt="Screenshot 4"></div>
        </div>
        <div class="card">
            <div class="card-header">media__1779013968522.png</div>
            <div class="card-body"><img src="assets/media__1779013968522.png" alt="Screenshot 5"></div>
        </div>
        <div class="card">
            <div class="card-header">media__1779014230541.png</div>
            <div class="card-body"><img src="assets/media__1779014230541.png" alt="Screenshot 6"></div>
        </div>
    </div>
</body>
</html>
